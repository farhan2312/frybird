# Front door for the local FryBird bench, like a production server:
#   http://<host>:8080/            -> bench web (8000)
#   http://<host>:8080/socket.io/  -> realtime (9000), so live updates work
# The site is always frybird.localhost, so tunnels (Cloudflare, Tailscale, ngrok) need no host rewriting.
# Install:  sudo cp nginx-frybird.conf /etc/nginx/sites-available/frybird && sudo ln -sf ../sites-available/frybird /etc/nginx/sites-enabled/frybird && sudo nginx -s reload

map $http_upgrade $frybird_connection_upgrade {
	default upgrade;
	''      close;
}

map $http_x_forwarded_proto $frybird_forwarded_proto {
	default $http_x_forwarded_proto;
	''      $scheme;
}

server {
	listen 8080;
	server_name _;
	client_max_body_size 50m;

	location /socket.io {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $frybird_connection_upgrade;
		proxy_set_header X-Frappe-Site-Name frybird.localhost;
		# browsers omit Origin on same-origin polling requests; Frappe socketio requires it to match Host
		proxy_set_header Origin $frybird_forwarded_proto://$http_host;
		proxy_set_header Host $host;
		proxy_read_timeout 120s;
		proxy_pass http://127.0.0.1:9000;
	}

	location / {
		proxy_set_header X-Frappe-Site-Name frybird.localhost;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $frybird_forwarded_proto;
		proxy_set_header X-Forwarded-Host $host;
		proxy_read_timeout 120s;
		proxy_redirect off;
		proxy_pass http://127.0.0.1:8000;
	}
}
